<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sentinel Hub v2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="page-login">
    <div class="auth-container">
        <h1 class="glitch-text"><i class="fas fa-microchip"></i> Sentinel Hub v2.0</h1>
        <h2><i class="fas fa-user-plus neon-cyan"></i> Registration Protocol</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                    {% for category, message in messages %}
                        <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}" class="auth-form" onsubmit="return validateRegisterForm(event)">
            <div class="input-group">
                <i class="fas fa-user icon neon-green"></i>
                <input type="text" id="full_name" name="full_name" placeholder="Full Name (Designation)" required>
            </div>

            <div class="input-group">
    <i class="fas fa-certificate icon neon-green"></i>
    <select id="rank" name="rank" required>
        <option value="" disabled selected>Select Rank (Indian Police)</option>
        <option value="DGP">Director General of Police (DGP)</option>
        <option value="ADG">Additional DGP (ADG)</option>
        <option value="IG">Inspector General (IG)</option>
        <option value="DIG">Deputy Inspector General (DIG)</option>
        <option value="SSP">Senior Superintendent of Police (SSP)</option>
        <option value="SP">Superintendent of Police (SP)</option>
        <option value="ASP">Assistant Superintendent of Police (ASP)</option>
        <option value="Inspector">Inspector</option>
        <option value="SubInspector">Sub-Inspector (SI)</option>
        <option value="Constable">Constable</option>
    </select>
</div>

            <div class="input-group">
                <i class="fas fa-id-badge icon neon-green"></i>
                <input type="text" id="badge_number" name="badge_number" placeholder="Unit/Badge ID" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-envelope icon neon-green"></i>
                <input type="email" id="email" name="email" placeholder="System Email" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock icon neon-green"></i>
                <input type="password" id="password" name="password" placeholder="Passkey (Min 6 characters)" required minlength="6">
            </div>
            
            <button type="submit" class="btn primary-btn">INITIALIZE ID <i class="fas fa-arrow-right"></i></button>
        </form>
        
        <p class="auth-switch">ID already initialized? <a href="{{ url_for('login') }}">Proceed to Access Protocol</a></p>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
