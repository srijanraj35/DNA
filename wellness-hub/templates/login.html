<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access - Sentinel Hub v2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="page-login">
    <div class="auth-container">
        <h1 class="glitch-text"><i class="fas fa-microchip"></i> Sentinel Hub v2.0</h1>
        <h2><i class="fas fa-lock neon-cyan"></i> System Access Protocol</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                    {% for category, message in messages %}
                        <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="input-group">
                <i class="fas fa-envelope icon neon-green"></i>
                <input type="email" id="email" name="email" placeholder="Access Email" required>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock icon neon-green"></i>
                <input type="password" id="password" name="password" placeholder="Passkey" required>
            </div>
            
            <button type="submit" class="btn primary-btn">LOG IN <i class="fas fa-sign-in-alt"></i></button>
        </form>
        
        <p class="auth-switch">New User ID detected? <a href="{{ url_for('register') }}">Initialize Registration Protocol</a></p>
    </div>
</body>
</html>
