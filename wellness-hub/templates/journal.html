<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal - Sentinel Hub v2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="page-journal">
    <div class="dashboard-container">
        
        <header class="dashboard-header">
            <div class="header-left">
                <a href="{{ url_for('dashboard') }}"><h1 class="glitch-text">&nbsp&nbsp&nbsp Welcome, {{ rank }} {{ full_name }} 👮</h1></a>
                <p class="status-time">&nbsp&nbsp&nbsp&nbsp<i class="fas fa-clock"></i> Date {{ today_date }}</p>
            </div>
            <div class="header-right">
                <div class="status-indicator {{ 'stress-level-' + stress_level|string }}">
                    Stress Index: <span>{{ stress_level }}/10</span> 
                </div>
                <button onclick="window.location.href='{{ url_for('logout') }}'" class="btn logout-btn">
                    <i class="fas fa-sign-out-alt"></i> SYSTEM LOGOUT
                </button>&nbsp&nbsp&nbsp&nbsp&nbsp
            </div>
        </header>

        <div class="grid-layout">
            
            <section class="card checkin-module full-width">
                <div class="Navbar-buttons">
                    <a href="{{ url_for('dashboard') }}"><button class="Navbar-btn">Dashboard</button></a>
                    <a href="{{ url_for('journal') }}"><button class="Navbar-btn">Journal</button></a>
                    <a href="{{ url_for('survey') }}"><button class="Navbar-btn">Survey</button></a>
                    <a href="{{ url_for('wearables') }}"><button class="Navbar-btn">Wearables</button></a>
                    <a href="{{ url_for('audio') }}"><button class="Navbar-btn">Audio</button></a>
                </div>
            </section>

            <section class="card journal-main-container full-width">
                
                <div class="journal-content-wrapper">
                    
                    <div class="journal-form-column">
                        <h2 style="margin-top: 0;"><i class="fas fa-pen-fancy neon-purple"></i> Journal</h2>                        
                        <form method="POST" class="entry-form">
                            <div class="input-group">
                                <textarea name="content" placeholder="Log your thoughts, feelings, or debrief here..." required>{{ today_content }}</textarea>
                            </div>
                            <button type="submit" class="btn primary-btn"><i class="fas fa-save"></i> SECURE LOG ENTRY</button>
                        </form>
                    </div>
                    
                    <div class="journal-history-column custom-scrollbar">
                        <h2 style="margin-top: 0; position: sticky; top: 0; z-index: 2;">
                            <i class="fas fa-history neon-purple"></i> Log History
                        </h2>
                        
                        <div class="journal-entries-container">
                            {% for entry in entries %}
                            <div class="journal-entry entry-clickable" 
                                 onclick="showJournalEntry(
                                     'Log for {{ entry.date }}',  '{{ entry.date }}', 
                                     '{{ entry.content | e }}',
                                     '{{ entry.id }}' 
                                 )">
                                
                                <p class="entry-title">{{ entry.date }}</p> 
                            </div>
                            {% endfor %}
                            
                            {% if not entries %}
                                <p class="entry-date">No past logs available.</p>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </section>
            
        </div>
    </div>

    <div id="actionModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle"></h3>
            <p id="modalBody"></p>
        </div>
    </div>

    <script>
        // Data passed from Flask
        const submitUrl = "{{ url_for('submit_interactive_status') }}";
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
