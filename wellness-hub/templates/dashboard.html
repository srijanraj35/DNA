<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sentinel Hub v2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="page-dashboard">
    <div class="dashboard-container">
        
        <header class="dashboard-header">
            <div class="header-left">
                <a href="{{ url_for('dashboard') }}"><h1 class="glitch-text">&nbsp&nbsp&nbsp Welcome, {{ rank }} {{ full_name }} 👮</h1></a>
                <p class="status-time">&nbsp&nbsp&nbsp&nbsp<i class="fas fa-clock"></i> Date {{ today_date }}</p>
            </div>
            <div class="header-right">
                <div class="status-indicator {{ 'stress-level-' + stress_level|string }}">
                    Stress Index: <span>{{ stress_level }}/10</span>
                </div>
                <button onclick="window.location.href='{{ url_for('logout') }}'" class="btn logout-btn">
                    <i class="fas fa-sign-out-alt"></i> SYSTEM LOGOUT
                </button>&nbsp&nbsp&nbsp&nbsp&nbsp
            </div>
        </header>

        

        <div class="grid-layout">



            <section class="card checkin-module full-width">
                <div class="Navbar-buttons">
    
    <a href="{{ url_for('dashboard') }}"><button class="Navbar-btn">Dashboard</button></a>
    <a href="{{ url_for('journal') }}"><button class="Navbar-btn">Journal</button></a>
    <a href="{{ url_for('survey') }}"><button class="Navbar-btn">Survey</button></a>
    <a href="{{ url_for('wearables') }}"><button class="Navbar-btn">Wearbales</button></a>
    <a href="{{ url_for('audio') }}"><button class="Navbar-btn">Audio</button></a>
    </div>
                
            </section>


            <section class="card chart-card">
                <h2><i class="fas fa-chart-line neon-purple"></i> 7-Day Strain Trend</h2>
                <canvas id="stressChart"></canvas>
            </section>

            <section class="card ai-analysis-card">
                <h2><i class="fas fa-microchip neon-blue"></i> Stress Analysis (AI Output)</h2>
                <div class="analysis-content">
                    <p class="analysis-mood">Current Mood State: <span id="display-mood" class="{{ 'mood-' + mood }}">{{ mood|upper }}</span></p>
                    <div class="ai-recommendation-box">
                        <p id="display-recommendation">{{ recommendations }}</p>
                    </div>
                </div>
            </section>

        </div>

    </div>

    <div id="actionModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle"></h3>
            <p id="modalBody"></p>
        </div>
    </div>

    <script>
        // Data passed from Flask
        const chartLabels = {{ chart_labels | tojson }};
        const chartData = {{ chart_data | tojson }};
        const submitUrl = "{{ url_for('submit_interactive_status') }}";
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
