<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal - Sentinel Hub v2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="page-survey">
    <div class="dashboard-container">
        
        <header class="dashboard-header">
            <div class="header-left">
                <a href="{{ url_for('dashboard') }}"><h1 class="glitch-text">&nbsp&nbsp&nbsp Welcome, {{ rank }} {{ full_name }} 👮</h1></a>
                <p class="status-time">&nbsp&nbsp&nbsp&nbsp<i class="fas fa-clock"></i> Date {{ today_date }}</p>
            </div>
            <div class="header-right">
                <div class="status-indicator {{ 'stress-level-' + stress_level|string }}">
                    Stress Index: <span>{{ stress_level }}/10</span> 
                </div>
                <button onclick="window.location.href='{{ url_for('logout') }}'" class="btn logout-btn">
                    <i class="fas fa-sign-out-alt"></i> SYSTEM LOGOUT
                </button>&nbsp&nbsp&nbsp&nbsp&nbsp
            </div>
        </header>

        <div class="grid-layout">
            
            <section class="card checkin-module full-width">
                <div class="Navbar-buttons">
                    <a href="{{ url_for('dashboard') }}"><button class="Navbar-btn">Dashboard</button></a>
                    <a href="{{ url_for('journal') }}"><button class="Navbar-btn">Journal</button></a>
                    <a href="{{ url_for('survey') }}"><button class="Navbar-btn">Survey</button></a>
                    <a href="{{ url_for('wearables') }}"><button class="Navbar-btn">Wearables</button></a>
                    <a href="{{ url_for('audio') }}"><button class="Navbar-btn">Audio</button></a>
                </div>
            </section>

            <section class="card full-width upload-card">
                <h2><i class="fas fa-upload neon-green"></i> Upload Audio Resource (MP3/WAV)</h2>
                
                <form method="POST" enctype="multipart/form-data" action="{{ url_for('audio') }}" class="upload-form">
    
                    <div class="file-input-wrapper"> 
                        
                        <div class="input-group file-input-group">
                            <label for="audio" class="file-label btn primary-btn">
                                <i class="fas fa-search"></i> Choose File
                            </label>
                            
                            <input type="file" id="audio" name="audio" accept=".mp3, .wav" required>
                            
                            <span id="file-name" class="file-name-display">No MP3/WAV selected.</span>
                        </div>
                    </div>

                    <button type="submit" class="btn primary-btn submit-upload-btn">
                        <i class="fas fa-arrow-up"></i> UPLOAD
                    </button>
                </form>
            </section>
            
        </div>
    </div>

    <div id="actionModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle"></h3>
            <p id="modalBody"></p>
        </div>
    </div>

    <script>
        const submitUrl = "{{ url_for('submit_interactive_status') }}";
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
